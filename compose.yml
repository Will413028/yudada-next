services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: yudada_dev
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "127.0.0.1:${DEV_DB_PORT:-55433}:5432"
    volumes:
      - dev-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "psql", "-h", "127.0.0.1", "-U", "postgres", "-d", "yudada_dev", "-c", "SELECT 1"]
      interval: 2s
      timeout: 2s
      retries: 60
      start_period: 15m
volumes:
  dev-db:
    name: yudada-next-postgres
